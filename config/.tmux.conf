# bash lives at /usr/local/bin/bash on OpenBSD
if-shell 'test -x /bin/bash' {
    set-option -g default-shell "/bin/bash"
    set-option -g default-command "/bin/bash -l"
} {
    set-option -g default-shell "/usr/local/bin/bash"
    set-option -g default-command "/usr/local/bin/bash -l"
}
set-option -g update-environment "PATH DISPLAY SSH_AUTH_SOCK"
setw -g mode-keys vi
set -g mouse on

set -g default-terminal "tmux-256color"
# tmux only auto-detects features for terminals it recognizes; declare them for ours
set -as terminal-features ',xterm-kitty*:RGB:extkeys:sync:hyperlinks:usstyle:strikethrough'
set -as terminal-features ',alacritty*:RGB:extkeys:sync:hyperlinks:usstyle:strikethrough'
set -as terminal-features ',xterm-256color:RGB:extkeys'
# 'always', not 'on': Claude Code never requests CSI u, so 'on' would not forward Shift+Enter
set -s extended-keys always
# emit \e[13;2u rather than the xterm \e[27;2;13~ form, which Claude Code/codex don't parse
set -s extended-keys-format csi-u

set -g base-index 1
setw -g pane-base-index 1

unbind C-b
set-option -g prefix `
bind-key e send-prefix

bind q kill-session

# split panes using | horizontally and - vertically
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

unbind r
bind r source-file ~/.tmux.conf \; display 'reloaded tmux config'

# prefix + / to search
bind-key / copy-mode \; send-key ?

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Left resize-pane -L 10
bind -n S-Right resize-pane -R 10
bind -n S-Up resize-pane -U 10
bind -n S-Down resize-pane -D 10

set -g status-interval 1
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour10
set -g status-left '#[fg=colour234,bold,bg=colour7] #H |#[fg=colour234,bold,bg=colour7] #S '
set -g status-left-length 40
set -g status-right '#[fg=colour234,bold,bg=colour7] %m/%d/%Y |#[fg=colour234,bold,bg=colour7] %H:%M:%S '
set -g status-right-length 23
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour15]#W#[fg=colour10]#F '
setw -g window-status-format ' #I#[fg=colour242]:#[fg=colour15]#W#[fg=colour242]#F '
